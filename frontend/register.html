<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | VoiceKhata</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon"><i class="bi bi-person-plus-fill"></i></div>
        <h1>Create Account</h1>
        <p>Start your digital khata</p>
      </div>

      <div id="formMessage" class="vk-alert" role="alert"></div>

      <form id="registerForm" novalidate>

        <div class="mb-3">
          <label for="role" class="form-label">I am a</label>
          <select id="role" class="form-select form-select-lg">
            <option value="OWNER">Shop Owner (Vendor)</option>
            <option value="CUSTOMER">Customer</option>
          </select>
          <div class="form-text" id="roleHint">Owners record credit and payments. Customers can view what they owe.</div>
        </div>

        <div class="mb-3">
          <label for="vendorName" class="form-label">Your Name</label>
          <input type="text" id="vendorName" class="form-control form-control-lg"
                 placeholder="e.g. Lakshmi" maxlength="40" autocomplete="name">
          <div class="invalid-feedback" id="vendorNameError"></div>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-control form-control-lg"
                 placeholder="10-digit mobile number"
                 inputmode="numeric" maxlength="10" autocomplete="tel">
          <div class="invalid-feedback" id="phoneError"></div>
        </div>

        <div class="mb-3">
          <label for="pin" class="form-label">Create 4-Digit PIN</label>
          <input type="password" id="pin" class="form-control form-control-lg"
                 placeholder="••••"
                 inputmode="numeric" maxlength="4" autocomplete="new-password">
          <div class="invalid-feedback" id="pinError"></div>
        </div>

        <div class="mb-4">
          <label for="confirmPin" class="form-label">Confirm PIN</label>
          <input type="password" id="confirmPin" class="form-control form-control-lg"
                 placeholder="••••"
                 inputmode="numeric" maxlength="4" autocomplete="new-password">
          <div class="invalid-feedback" id="confirmPinError"></div>
        </div>

        <button type="submit" class="btn btn-vk-teal btn-lg w-100">
          <i class="bi bi-check-circle me-1"></i> Register
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        Already registered? <a href="login.html" class="auth-link">Login here</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
