<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | VoiceKhata</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- We are inside /customers, so ../ goes up to /frontend -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- ===== Navigation bar ===== -->
  <nav class="navbar navbar-expand-md vk-navbar">
    <div class="container">
      <a class="navbar-brand" href="../dashboard/dashboard.html">
        <i class="bi bi-mic-fill"></i> VoiceKhata
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainMenu"
              aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../dashboard/dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="customers.html"><i class="bi bi-people me-1"></i> Customers</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../transactions/transactions.html"><i class="bi bi-receipt me-1"></i> Transactions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Page content ===== -->
  <main class="container page-wrap">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h1 class="welcome-title">My Customers</h1>
        <p class="welcome-sub" id="customerCount">Loading...</p>
      </div>
      <button type="button" class="btn btn-vk-teal" id="addCustomerBtn">
        <i class="bi bi-person-plus me-1"></i> Add Customer
      </button>
    </div>

    <input type="search" id="searchBox" class="form-control form-control-lg mb-3"
           placeholder="Search customer name...">

    <section class="section-card">
      <div id="customerList"></div>
    </section>

  </main>

  <!-- ===== Add / edit customer pop-up ===== -->
  <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="customerModalTitle">Add Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="customerMessage" class="vk-alert" role="alert"></div>

          <div class="mb-3">
            <label for="cName" class="form-label">Customer name</label>
            <input type="text" id="cName" class="form-control form-control-lg" maxlength="40" placeholder="e.g. Kavita">
          </div>
          <div class="mb-3">
            <label for="cPhone" class="form-label">WhatsApp / phone number</label>
            <input type="tel" id="cPhone" class="form-control form-control-lg"
                   inputmode="numeric" maxlength="10" placeholder="10-digit number">
            <div class="customer-hint">Needed to send WhatsApp reminders.</div>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary btn-lg flex-fill" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-vk-teal btn-lg flex-fill" id="saveCustomerBtn">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Order matters: auth.js, data.js, then customers.js -->
  <script src="../js/auth.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/customers.js"></script>

    <script src="../js/lang.js"></script>
</body>
</html>
