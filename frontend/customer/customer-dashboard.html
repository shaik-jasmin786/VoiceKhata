<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dues | VoiceKhata</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- We are inside /customer, so ../ goes up to /frontend -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- ===== Navigation bar ===== -->
  <nav class="navbar navbar-expand-md vk-navbar">
    <div class="container">
      <a class="navbar-brand" href="customer-dashboard.html">
        <i class="bi bi-mic-fill"></i> VoiceKhata
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainMenu"
              aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="customer-dashboard.html"><i class="bi bi-wallet2 me-1"></i> My Dues</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Page content ===== -->
  <main class="container page-wrap">

    <h1 class="welcome-title" id="welcomeTitle">Welcome!</h1>
    <p class="welcome-sub">Here is what you owe at each shop.</p>

    <!-- Two summary cards -->
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <div class="stat-card pending">
          <div class="stat-label"><i class="bi bi-cash-coin me-1"></i> Total I Owe</div>
          <div class="stat-value" id="totalOwed">₹0</div>
          <div class="stat-note">Across all shops</div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="stat-card customers">
          <div class="stat-label"><i class="bi bi-shop me-1"></i> Shops</div>
          <div class="stat-value" id="shopCount">0</div>
          <div class="stat-note">Where you have an account</div>
        </div>
      </div>
    </div>

    <!-- One card for each shop (filled by JavaScript) -->
    <h2 class="section-title mt-4 mb-3">My Shops</h2>
    <div id="shopList"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Order matters: auth.js, data.js, then customer-dashboard.js -->
  <script src="../js/auth.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/customer-dashboard.js"></script>
</body>
</html>
