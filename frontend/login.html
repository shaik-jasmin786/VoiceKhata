<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | VoiceKhata</title>

  <!-- Bootstrap 5 and Bootstrap Icons (from the internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Our own CSS (this page is directly inside "frontend", so no ../ needed) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo and title -->
      <div class="brand">
        <div class="brand-icon"><i class="bi bi-mic-fill"></i></div>
        <h1>VoiceKhata</h1>
        <p>Speak. Save. Collect.</p>
      </div>

      <!-- Message area (JavaScript fills this) -->
      <div id="formMessage" class="vk-alert" role="alert"></div>

      <!-- Login form -->
      <form id="loginForm" novalidate>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-control form-control-lg"
                 placeholder="10-digit mobile number"
                 inputmode="numeric" maxlength="10" autocomplete="tel">
          <div class="invalid-feedback" id="phoneError"></div>
        </div>

        <div class="mb-4">
          <label for="pin" class="form-label">4-Digit PIN</label>
          <input type="password" id="pin" class="form-control form-control-lg"
                 placeholder="••••"
                 inputmode="numeric" maxlength="4" autocomplete="current-password">
          <div class="invalid-feedback" id="pinError"></div>
        </div>

        <button type="submit" class="btn btn-vk-primary btn-lg w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        New vendor? <a href="register.html" class="auth-link">Register here</a>
      </p>

    </div>
  </div>

  <!-- Bootstrap JS, then our script (at the bottom so the page loads first) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
