<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transactions | VoiceKhata</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- ===== Navigation bar ===== -->
  <nav class="navbar navbar-expand-md vk-navbar">
    <div class="container">
      <a class="navbar-brand" href="../dashboard/dashboard.html">
        <i class="bi bi-mic-fill"></i> VoiceKhata
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainMenu"
              aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../dashboard/dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../customers/customers.html"><i class="bi bi-people me-1"></i> Customers</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="transactions.html"><i class="bi bi-receipt me-1"></i> Transactions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="logout(); return false;"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Page content ===== -->
  <main class="container page-wrap">

    <h1 class="welcome-title">Transaction History</h1>
    <p class="welcome-sub" id="resultCount">Loading...</p>

    <div class="filter-bar mb-3" id="filterBar">
      <button type="button" class="filter-btn active" data-filter="ALL">All</button>
      <button type="button" class="filter-btn" data-filter="CREDIT">Credit</button>
      <button type="button" class="filter-btn" data-filter="PAYMENT">Payment</button>
      <button type="button" class="filter-btn" data-filter="PENDING">Pending</button>
      <button type="button" class="filter-btn" data-filter="PAID">Paid</button>
    </div>

    <section class="section-card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Item</th>
              <th class="text-center">Qty</th>
              <th class="text-end">Amount</th>
              <th>Type</th>
              <th>Date</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
      <div id="emptyMessage" class="empty-state d-none">No transactions found for this filter.</div>
    </section>

  </main>

  <!-- ===== Edit pop-up ===== -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalTitle"><i class="bi bi-pencil-square me-1"></i> Edit Transaction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="editMessage" class="vk-alert" role="alert"></div>

          <div class="mb-3">
            <label for="eCustomer" class="form-label">Customer name</label>
            <input type="text" id="eCustomer" class="form-control form-control-lg"
                   list="editCustomerList" maxlength="40" autocomplete="off">
            <datalist id="editCustomerList"></datalist>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Type</label>
            <div class="btn-group w-100" role="group" aria-label="Transaction type">
              <input type="radio" class="btn-check" name="eType" id="eTypeCredit" value="CREDIT" checked>
              <label class="btn btn-outline-warning btn-lg" for="eTypeCredit">Credit (took)</label>

              <input type="radio" class="btn-check" name="eType" id="eTypePayment" value="PAYMENT">
              <label class="btn btn-outline-success btn-lg" for="eTypePayment">Payment (paid)</label>
            </div>
          </div>

          <div class="row g-3" id="eItemRow">
            <div class="col-8">
              <label for="eItem" class="form-label">Item</label>
              <input type="text" id="eItem" class="form-control form-control-lg" maxlength="30">
            </div>
            <div class="col-4">
              <label for="eQty" class="form-label">Qty</label>
              <input type="number" id="eQty" class="form-control form-control-lg" min="1">
            </div>
          </div>

          <div class="mt-3">
            <label for="eAmount" class="form-label">Amount (₹)</label>
            <input type="number" id="eAmount" class="form-control form-control-lg" min="1">
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="button" class="btn btn-outline-secondary btn-lg flex-fill" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-vk-teal btn-lg flex-fill" id="saveEditBtn">
              <i class="bi bi-check-circle me-1"></i> Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Delete confirmation pop-up ===== -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalTitle"><i class="bi bi-exclamation-triangle text-danger me-1"></i> Delete this entry?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="deleteText" class="mb-3"></p>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary btn-lg flex-fill" data-bs-dismiss="modal">No, keep it</button>
            <button type="button" class="btn btn-danger btn-lg flex-fill" id="confirmDeleteBtn">Yes, delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Order matters: auth.js, data.js, then transactions.js -->
  <script src="../js/auth.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/transactions.js"></script>

    <script src="../js/lang.js"></script>
</body>
</html>
