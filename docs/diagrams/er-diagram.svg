<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0B2A5B">VoiceKhata – ER Diagram</text>

  <!-- vendors -->
  <rect x="30" y="80" width="260" height="196" rx="10" fill="#fff" stroke="#0B2A5B" stroke-width="2.5"/>
  <rect x="30" y="80" width="260" height="36" rx="10" fill="#0B2A5B"/>
  <text x="160" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">vendors</text>
  <g font-size="14" fill="#1c2a3a">
    <text x="46" y="140">id <tspan fill="#12B5B0" font-weight="bold">  PK</tspan></text>
    <text x="46" y="168">vendor_name</text>
    <text x="46" y="196">phone <tspan fill="#6b7a90">  UNIQUE</tspan></text>
    <text x="46" y="224">pin_hash <tspan fill="#6b7a90">  (BCrypt)</tspan></text>
    <text x="46" y="252">created_at</text>
  </g>

  <!-- customers -->
  <rect x="370" y="80" width="260" height="196" rx="10" fill="#fff" stroke="#12B5B0" stroke-width="2.5"/>
  <rect x="370" y="80" width="260" height="36" rx="10" fill="#12B5B0"/>
  <text x="500" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">customers</text>
  <g font-size="14" fill="#1c2a3a">
    <text x="386" y="140">id <tspan fill="#12B5B0" font-weight="bold">  PK</tspan></text>
    <text x="386" y="168">vendor_id <tspan fill="#d98a00" font-weight="bold">  FK</tspan></text>
    <text x="386" y="196">name <tspan fill="#6b7a90">  (unique per vendor)</tspan></text>
    <text x="386" y="224">phone</text>
    <text x="386" y="252">created_at</text>
  </g>

  <!-- transactions -->
  <rect x="710" y="80" width="260" height="336" rx="10" fill="#fff" stroke="#0B2A5B" stroke-width="2.5"/>
  <rect x="710" y="80" width="260" height="36" rx="10" fill="#0B2A5B"/>
  <text x="840" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">transactions</text>
  <g font-size="14" fill="#1c2a3a">
    <text x="726" y="140">id <tspan fill="#12B5B0" font-weight="bold">  PK</tspan></text>
    <text x="726" y="168">vendor_id <tspan fill="#d98a00" font-weight="bold">  FK</tspan></text>
    <text x="726" y="196">customer_id <tspan fill="#d98a00" font-weight="bold">  FK</tspan></text>
    <text x="726" y="224">type <tspan fill="#6b7a90">  CREDIT / PAYMENT</tspan></text>
    <text x="726" y="252">item_name</text>
    <text x="726" y="280">quantity</text>
    <text x="726" y="308">amount</text>
    <text x="726" y="336">voice_text</text>
    <text x="726" y="364">transaction_date</text>
  </g>

  <!-- relations -->
  <line x1="290" y1="178" x2="370" y2="178" stroke="#0B2A5B" stroke-width="2.5"/>
  <text x="300" y="168" font-size="15" font-weight="bold" fill="#0B2A5B">1</text>
  <text x="352" y="168" font-size="15" font-weight="bold" fill="#0B2A5B">∞</text>
  <text x="330" y="200" text-anchor="middle" font-size="12" fill="#6b7a90">has</text>

  <line x1="630" y1="178" x2="710" y2="178" stroke="#0B2A5B" stroke-width="2.5"/>
  <text x="640" y="168" font-size="15" font-weight="bold" fill="#0B2A5B">1</text>
  <text x="692" y="168" font-size="15" font-weight="bold" fill="#0B2A5B">∞</text>
  <text x="670" y="200" text-anchor="middle" font-size="12" fill="#6b7a90">has</text>

  <path d="M160 276 L160 440 L840 440 L840 416" fill="none" stroke="#0B2A5B" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="170" y="432" font-size="15" font-weight="bold" fill="#0B2A5B">1</text>
  <text x="822" y="434" font-size="15" font-weight="bold" fill="#0B2A5B">∞</text>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#6b7a90">one vendor owns many transactions (faster dashboard queries)</text>

  <text x="30" y="318" font-size="13" fill="#1c2a3a" font-weight="bold">Rules</text>
  <text x="30" y="340" font-size="12" fill="#6b7a90">• One vendor → many customers</text>
  <text x="30" y="360" font-size="12" fill="#6b7a90">• One customer → many transactions</text>
  <text x="30" y="380" font-size="12" fill="#6b7a90">• Balance = Σ CREDIT − Σ PAYMENT</text>
  <text x="30" y="400" font-size="12" fill="#6b7a90">• Balance is calculated, not stored</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
