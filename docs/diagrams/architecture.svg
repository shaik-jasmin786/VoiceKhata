<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B2A5B"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#0B2A5B">VoiceKhata – System Architecture</text>

  <rect x="40" y="90" width="260" height="270" rx="16" fill="#eef3fb" stroke="#0B2A5B" stroke-width="3"/>
  <rect x="40" y="90" width="260" height="56" rx="16" fill="#0B2A5B"/>
  <text x="170" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">FRONTEND</text>
  <text x="170" y="136" text-anchor="middle" font-size="14" fill="#cfe0ff">Browser (Google Chrome)</text>
  <g font-size="15" fill="#1c2a3a">
    <text x="62" y="182">• HTML5 + CSS3</text>
    <text x="62" y="212">• Bootstrap 5</text>
    <text x="62" y="242">• JavaScript</text>
    <text x="62" y="272">• Web Speech API (voice → text)</text>
    <text x="62" y="302">• Rule-based voice parser</text>
    <text x="62" y="332">• English · Hindi · Telugu</text>
  </g>

  <rect x="370" y="90" width="260" height="270" rx="16" fill="#e8f9f8" stroke="#12B5B0" stroke-width="3"/>
  <rect x="370" y="90" width="260" height="56" rx="16" fill="#12B5B0"/>
  <text x="500" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">BACKEND</text>
  <text x="500" y="136" text-anchor="middle" font-size="14" fill="#e6fffe">Spring Boot 3 · Java 17 · Port 8080</text>
  <g font-size="15" fill="#1c2a3a">
    <text x="392" y="182">• Controller (REST APIs)</text>
    <text x="392" y="212">• Service (business logic)</text>
    <text x="392" y="242">• Repository (Spring Data JPA)</text>
    <text x="392" y="272">• Validation + error handling</text>
    <text x="392" y="302">• BCrypt PIN hashing</text>
    <text x="392" y="332">• Token-based login</text>
  </g>

  <rect x="700" y="90" width="260" height="270" rx="16" fill="#eef3fb" stroke="#0B2A5B" stroke-width="3"/>
  <rect x="700" y="90" width="260" height="56" rx="16" fill="#0B2A5B"/>
  <text x="830" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">DATABASE</text>
  <text x="830" y="136" text-anchor="middle" font-size="14" fill="#cfe0ff">MySQL 8</text>
  <g font-size="15" fill="#1c2a3a">
    <text x="722" y="190">• vendors</text>
    <text x="722" y="226">• customers</text>
    <text x="722" y="262">• transactions</text>
    <text x="722" y="310" font-size="13" fill="#6b7a90">Balance = credit − payments</text>
    <text x="722" y="332" font-size="13" fill="#6b7a90">(calculated, never stored)</text>
  </g>

  <line x1="302" y1="215" x2="368" y2="215" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="368" y1="245" x2="302" y2="245" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <text x="335" y="200" text-anchor="middle" font-size="12" fill="#0B2A5B" font-weight="bold">HTTP</text>
  <text x="335" y="262" text-anchor="middle" font-size="12" fill="#0B2A5B" font-weight="bold">JSON</text>

  <line x1="632" y1="215" x2="698" y2="215" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="698" y1="245" x2="632" y2="245" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <text x="665" y="200" text-anchor="middle" font-size="12" fill="#0B2A5B" font-weight="bold">JDBC</text>
  <text x="665" y="262" text-anchor="middle" font-size="12" fill="#0B2A5B" font-weight="bold">SQL</text>

  <rect x="40" y="395" width="920" height="52" rx="12" fill="#f3f5f8" stroke="#d5dbe5"/>
  <text x="500" y="418" text-anchor="middle" font-size="14" fill="#1c2a3a">Every request carries  Authorization: Bearer &lt;token&gt;  so each vendor sees only their own data.</text>
  <text x="500" y="438" text-anchor="middle" font-size="14" fill="#1c2a3a">WhatsApp reminders open directly from the browser using a wa.me link (no backend needed).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
