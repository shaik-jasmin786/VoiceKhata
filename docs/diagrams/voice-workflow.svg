<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B2A5B"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#0B2A5B">VoiceKhata – Voice Transaction Workflow</text>
  <text x="500" y="72" text-anchor="middle" font-size="15" fill="#6b7a90">Example: “Ramu took 2 tea, 20 rupees”</text>

  <g>
    <rect x="40" y="100" width="190" height="150" rx="14" fill="#eef3fb" stroke="#0B2A5B" stroke-width="2.5"/>
    <circle cx="62" cy="122" r="14" fill="#0B2A5B"/><text x="62" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
    <text x="135" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Choose language</text>
    <text x="135" y="184" text-anchor="middle" font-size="13" fill="#1c2a3a">Tap the mic and</text>
    <text x="135" y="204" text-anchor="middle" font-size="13" fill="#1c2a3a">speak naturally</text>
    <text x="135" y="228" text-anchor="middle" font-size="12" fill="#6b7a90">Frontend</text>
  </g>
  <g>
    <rect x="290" y="100" width="190" height="150" rx="14" fill="#eef3fb" stroke="#0B2A5B" stroke-width="2.5"/>
    <circle cx="312" cy="122" r="14" fill="#0B2A5B"/><text x="312" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
    <text x="385" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Speech → text</text>
    <text x="385" y="184" text-anchor="middle" font-size="13" fill="#1c2a3a">Web Speech API</text>
    <text x="385" y="204" text-anchor="middle" font-size="13" fill="#1c2a3a">(en-IN, hi-IN, te-IN)</text>
    <text x="385" y="228" text-anchor="middle" font-size="12" fill="#6b7a90">Browser</text>
  </g>
  <g>
    <rect x="540" y="100" width="190" height="150" rx="14" fill="#eef3fb" stroke="#0B2A5B" stroke-width="2.5"/>
    <circle cx="562" cy="122" r="14" fill="#0B2A5B"/><text x="562" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
    <text x="635" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Rule-based parser</text>
    <text x="635" y="184" text-anchor="middle" font-size="13" fill="#1c2a3a">Finds customer, item,</text>
    <text x="635" y="204" text-anchor="middle" font-size="13" fill="#1c2a3a">quantity, amount, type</text>
    <text x="635" y="228" text-anchor="middle" font-size="12" fill="#6b7a90">voice.js</text>
  </g>
  <g>
    <rect x="790" y="100" width="190" height="150" rx="14" fill="#e8f9f8" stroke="#12B5B0" stroke-width="2.5"/>
    <circle cx="812" cy="122" r="14" fill="#12B5B0"/><text x="812" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
    <text x="885" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Confirmation card</text>
    <text x="885" y="184" text-anchor="middle" font-size="13" fill="#1c2a3a">Vendor checks and</text>
    <text x="885" y="204" text-anchor="middle" font-size="13" fill="#1c2a3a">edits any detail</text>
    <text x="885" y="228" text-anchor="middle" font-size="12" fill="#6b7a90">Frontend</text>
  </g>

  <line x1="232" y1="175" x2="288" y2="175" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="482" y1="175" x2="538" y2="175" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="732" y1="175" x2="788" y2="175" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="885" y1="252" x2="885" y2="318" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="790" y="320" width="190" height="150" rx="14" fill="#e8f9f8" stroke="#12B5B0" stroke-width="2.5"/>
    <circle cx="812" cy="342" r="14" fill="#12B5B0"/><text x="812" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text>
    <text x="885" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Confirm and Save</text>
    <text x="885" y="404" text-anchor="middle" font-size="13" fill="#1c2a3a">POST</text>
    <text x="885" y="424" text-anchor="middle" font-size="13" fill="#1c2a3a">/api/transactions</text>
    <text x="885" y="448" text-anchor="middle" font-size="12" fill="#6b7a90">Frontend → Backend</text>
  </g>
  <g>
    <rect x="540" y="320" width="190" height="150" rx="14" fill="#e8f9f8" stroke="#12B5B0" stroke-width="2.5"/>
    <circle cx="562" cy="342" r="14" fill="#12B5B0"/><text x="562" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">6</text>
    <text x="635" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Validate</text>
    <text x="635" y="404" text-anchor="middle" font-size="13" fill="#1c2a3a">Check token and data,</text>
    <text x="635" y="424" text-anchor="middle" font-size="13" fill="#1c2a3a">find or create customer</text>
    <text x="635" y="448" text-anchor="middle" font-size="12" fill="#6b7a90">Spring Boot</text>
  </g>
  <g>
    <rect x="290" y="320" width="190" height="150" rx="14" fill="#eef3fb" stroke="#0B2A5B" stroke-width="2.5"/>
    <circle cx="312" cy="342" r="14" fill="#0B2A5B"/><text x="312" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">7</text>
    <text x="385" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Save in MySQL</text>
    <text x="385" y="404" text-anchor="middle" font-size="13" fill="#1c2a3a">INSERT into</text>
    <text x="385" y="424" text-anchor="middle" font-size="13" fill="#1c2a3a">transactions table</text>
    <text x="385" y="448" text-anchor="middle" font-size="12" fill="#6b7a90">Database</text>
  </g>
  <g>
    <rect x="40" y="320" width="190" height="150" rx="14" fill="#eef3fb" stroke="#0B2A5B" stroke-width="2.5"/>
    <circle cx="62" cy="342" r="14" fill="#0B2A5B"/><text x="62" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">8</text>
    <text x="135" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B2A5B">Dashboard updates</text>
    <text x="135" y="404" text-anchor="middle" font-size="13" fill="#1c2a3a">Balance = credit −</text>
    <text x="135" y="424" text-anchor="middle" font-size="13" fill="#1c2a3a">payments (₹20 owed)</text>
    <text x="135" y="448" text-anchor="middle" font-size="12" fill="#6b7a90">Frontend</text>
  </g>

  <line x1="788" y1="395" x2="732" y2="395" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="538" y1="395" x2="482" y2="395" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="288" y1="395" x2="232" y2="395" stroke="#0B2A5B" stroke-width="3" marker-end="url(#a)"/>

  <text x="500" y="508" text-anchor="middle" font-size="14" fill="#6b7a90">Nothing is saved until the vendor confirms, so speech mistakes never reach the database.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
